test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Object storage for breed images. `public: true` means blobs are uploaded with
# a public ACL and `url` returns a permanent, unsigned URL, which is what the
# API hands out and what a CDN in front of the bucket can cache forever.
amazon:
  service: S3
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  bucket: <%= ENV["S3_BUCKET"] %>
  public: true

# Backblaze B2 through its S3 compatible API. The bucket must be public: B2
# has no object level ACLs, so whether a file is reachable without a signature
# is decided by the bucket setting alone.
backblaze:
  service: S3
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV["S3_REGION"] %>
  bucket: <%= ENV["S3_BUCKET"] %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  # B2 rejects the CRC checksums newer aws-sdk versions send by default.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
  public: true

# Cloudflare R2 speaks the S3 API but has a single pseudo-region and requires
# the account endpoint. Buckets are not public through the API endpoint, so
# S3_PUBLIC_HOST must point at the bucket's public r2.dev or custom domain.
cloudflare:
  service: S3
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV["S3_BUCKET"] %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
  public: true
